
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Boston Bikewatching</title>

    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="map.css">

    <link
        href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css"
        rel="stylesheet"
    >

    <script type="module" src="map.js"></script>
</head>

<body>
    <header>
        <div>
            <h1>🚴 Boston Bikewatching</h1>
            <p>
                Explore Bluebikes traffic in Boston and Cambridge
                during different times of the day.
            </p>
        </div>

        <label class="time-filter" for="time-slider">
            Filter by time:

            <input
                type="range"
                id="time-slider"
                min="-1"
                max="1439"
                value="-1"
                step="1"
            >

            <time id="selected-time"></time>
            <em id="any-time">(any time)</em>
        </label>
    </header>

    <div id="map">
        <svg aria-label="Bluebikes station traffic"></svg>
    </div>

    <div class="legend">
        <div style="--departure-ratio: 1">
            More departures
        </div>

        <div style="--departure-ratio: 0.5">
            Balanced
        </div>

        <div style="--departure-ratio: 0">
            More arrivals
        </div>
    </div>
</body>
</html>
